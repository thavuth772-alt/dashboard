<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TrainerHRMS | Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;background:linear-gradient(135deg,#087f7c,#116e9b);display:grid;place-items:center;padding:20px}.login{width:min(430px,100%);background:#fff;border-radius:24px;padding:38px;box-shadow:0 25px 70px #063d4c55}.logo{width:58px;height:58px;border-radius:16px;background:linear-gradient(135deg,#0b9f9b,#1476b8);color:#fff;display:grid;place-items:center;font-size:27px;font-weight:800;margin-bottom:22px}.eyebrow{font-size:10px;letter-spacing:1.5px;color:#71838a;font-weight:800}.login h1{margin:7px 0 8px;font-size:27px;color:#173238}.sub{color:#71838a;font-size:12px;margin:0 0 28px;line-height:1.6}label{display:grid;gap:7px;font-size:11px;font-weight:700;color:#52686f;margin-bottom:15px}input{padding:13px;border:1px solid #dfe8ea;border-radius:10px;outline:0;font:inherit}input:focus{border-color:#0b9f9b;box-shadow:0 0 0 3px #0b9f9b18}.btn{width:100%;padding:13px;border:0;border-radius:10px;background:#0b9f9b;color:#fff;font-weight:800;cursor:pointer}.btn:hover{background:#087f7c}.error{color:#c84a4a;background:#fff0f0;border-radius:9px;padding:10px;font-size:11px;margin-bottom:14px;display:none}.demo{margin-top:20px;padding:13px;background:#eef8f7;border-radius:10px;color:#47656b;font-size:10px;line-height:1.6}.demo strong{color:#173238}.footer{text-align:center;color:#9aa9ad;font-size:9px;margin-top:22px}
</style>
</head>
<body>
<div class="login">
<div class="logo">T</div><div class="eyebrow">TRAINERHRMS</div><h1>Welcome back</h1><p class="sub">Sign in to access your employee dashboard, attendance, leave and EOD reports.</p>
<div class="error" id="error">Invalid username or password.</div>
<form id="loginForm">
<label>Username<input id="username" autocomplete="username" placeholder="Enter username" required></label>
<label>Password<input id="password" type="password" autocomplete="current-password" placeholder="Enter password" required></label>
<button class="btn" type="submit">Sign In</button>
</form>
<div class="demo"><strong>Demo credentials</strong><br>Username: <strong>thavuth</strong><br>Password: <strong>Thavuth@123</strong></div>
<div class="footer">TrainerHRMS • Demo application</div>
</div>
<script>
if(sessionStorage.getItem("trainerhrms_auth")==="true") location.replace("index.html");
document.getElementById("loginForm").addEventListener("submit",function(e){e.preventDefault();const u=document.getElementById("username").value.trim(),p=document.getElementById("password").value;const ok=u==="thavuth"&&p==="Thavuth@123";if(ok){sessionStorage.setItem("trainerhrms_auth","true");location.replace("index.html")}else document.getElementById("error").style.display="block"});
</script>
</body></html>
