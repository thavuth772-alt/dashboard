<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TrainerHRMS | Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;background:linear-gradient(135deg,#087f7c,#116e9b);display:grid;place-items:center;padding:20px}.box{width:min(450px,100%);background:#fff;border-radius:24px;padding:36px;box-shadow:0 25px 70px #063d4c55}.logo{width:58px;height:58px;border-radius:16px;background:linear-gradient(135deg,#0b9f9b,#1476b8);color:#fff;display:grid;place-items:center;font-size:27px;font-weight:800;margin-bottom:20px}.ey{font-size:10px;letter-spacing:1.5px;color:#71838a;font-weight:800}.box h1{margin:7px 0;color:#173238;font-size:27px}.sub{font-size:12px;color:#71838a;line-height:1.6;margin-bottom:25px}label{display:grid;gap:7px;font-size:11px;font-weight:700;color:#52686f;margin-bottom:14px}input{padding:12px;border:1px solid #dfe8ea;border-radius:10px;font:inherit;outline:0}input:focus{border-color:#0b9f9b}.btn{width:100%;padding:13px;border:0;border-radius:10px;background:#0b9f9b;color:#fff;font-weight:800;cursor:pointer}.msg{display:none;padding:10px;border-radius:9px;font-size:11px;margin-bottom:14px}.error{background:#fff0f0;color:#c84a4a}.success{background:#eef9f5;color:#287a52}.links{text-align:center;margin-top:18px;font-size:11px;color:#71838a}.links a{color:#087f7c;font-weight:800;text-decoration:none}
</style></head><body><div class="box"><div class="logo">T</div><div class="ey">TRAINERHRMS</div><h1>Create your account</h1><p class="sub">Register first. Then use your own username and password to sign in to the HRMS dashboard.</p>
<div class="msg error" id="error"></div><div class="msg success" id="success"></div>
<form id="registerForm"><label>Full Name<input id="name" required placeholder="Enter your name"></label><label>Email<input id="email" type="email" required placeholder="name@example.com"></label><label>Password<input id="password" type="password" required minlength="6" placeholder="Create a password"></label><label>Confirm Password<input id="confirm" type="password" required minlength="6" placeholder="Re-enter password"></label><button class="btn" type="submit">Create Account</button></form>
<div class="links">Already registered? <a href="login.html">Sign in</a></div></div>
<script type="module">
import { auth } from "./firebase-auth.js";
import { createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
const form=document.getElementById("registerForm"), error=document.getElementById("error"), success=document.getElementById("success");
form.addEventListener("submit",async e=>{
 e.preventDefault(); error.style.display="none"; success.style.display="none";
 const name=document.getElementById("name").value.trim(), email=document.getElementById("email").value.trim(), password=document.getElementById("password").value, confirm=document.getElementById("confirm").value;
 if(password!==confirm){error.textContent="Passwords do not match.";error.style.display="block";return}
 try { const cred=await createUserWithEmailAndPassword(auth,email,password); await updateProfile(cred.user,{displayName:name}); success.textContent="Account created successfully. Redirecting to login..."; success.style.display="block"; setTimeout(()=>location.href="login.html",900); }
 catch(err){ error.textContent=err.code==="auth/email-already-in-use"?"This email is already registered.":err.message; error.style.display="block"; }
});
</script></body></html>
